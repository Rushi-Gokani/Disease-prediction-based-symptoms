# This file contains the Project Configuration Parameters

# Random State
random_state: 101

# Verbose for Log Prints
verbose: True

# Dataset Path
dataset:
  # Training Dataset Path
  training_data_path: './dataset/training_data.csv'
  # Test Dataset Path
  test_data_path: './dataset/test_data.csv'
  # Validation Data Size for train_test_split
  validation_size: 0.33

# Model Parameters
model:
  # Decision Tree
  decision_tree:
    criterion: 'gini'
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1

  # Random Forest Classifier
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1

  # Gradient Boosting Classifier
  gradient_boost:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 5
    criterion: 'friedman_mse'

  # SVM
  svm:
    C: 0.1
    kernel: 'rbf'
    gamma: 'scale'

  # XGBoost
  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    subsample: 0.8

# Model Save Path
model_save_path: './saved_model/'